version: "3.8"

networks:
  pavilion_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  media_uploads:

services:
  mysql:
    image: mysql:8.0
    container_name: pavilion_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_super_secure_2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-realestate_db}
      MYSQL_USER: ${MYSQL_USER:-realestate_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-realestate_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pavilion_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_super_secure_2025}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pavilion_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - pavilion_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pavilion_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production-pavilion-2025-token}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production-pavilion-2025-auth}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-realestate_db}
      MYSQL_USER: ${MYSQL_USER:-realestate_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-realestate_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-amz-staging-s3-bucket}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      MEDIA_DIR: /app/media/uploads
      CORS_ORIGINS: '["http://localhost", "http://localhost:8080", "http://localhost:3000", "http://localhost:80", "http://127.0.0.1:8080", "http://127.0.0.1:3000", "http://127.0.0.1"]'
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@pavilionrealty.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@Pavilion2025!}
    ports:
      - "8000:8000"
    volumes:
      - media_uploads:/app/media/uploads
    networks:
      - pavilion_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pavilion_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: http://localhost:8080
      NODE_ENV: production
    networks:
      - pavilion_network
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: pavilion_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_uploads:/var/www/media:ro
    networks:
      - pavilion_network
    depends_on:
      - backend
      - frontend
